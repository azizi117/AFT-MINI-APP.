<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFT NETWORK</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b1220;color:white;
 font-family:Arial,sans-serif;text-align:center;
}
header{padding:22px;color:#f5c451;font-size:25px;font-weight:bold}
.card{
 margin:15px;padding:22px;background:#17243a;
 border-radius:20px;border:1px solid #35445c;
}
.balance{font-size:38px;color:#f5c451;font-weight:bold;margin:15px}
.tap{
 width:165px;height:165px;border-radius:50%;
 border:7px solid #ffe08a;
 background:linear-gradient(145deg,#ffe08a,#b77b13);
 color:#111;font-size:30px;font-weight:bold;
 margin:20px;cursor:pointer;
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.item{
 background:#17243a;border:1px solid #35445c;
 padding:22px 8px;border-radius:15px;color:white;
 font-size:16px;cursor:pointer;
}
.item span{display:block;font-size:25px;margin-bottom:10px}
button:active{transform:scale(.96)}
nav{
 position:fixed;bottom:0;width:100%;
 display:flex;justify-content:space-around;
 background:#17243a;padding:15px 2px;
}
nav button{background:none;border:0;color:white;font-size:12px}
.page{display:none;padding-bottom:100px}
.active{display:block}
</style>
</head>
<body>

<header>⚡ AFT NETWORK</header>

<div id="home" class="page active">
 <div class="card">
  <p>موجودی شما</p>
  <div class="balance" id="balance">0</div>
  <p>AFT POINTS</p>
  <button class="tap" onclick="tap()">TAP</button>
  <p>قدرت هر ضربه: <b id="power">1</b></p>
 </div>

 <div class="grid">
  <button class="item" onclick="show('mining')">
   <span>⛏️</span>ماینینگ
  </button>
  <button class="item" onclick="show('tasks')">
   <span>🎯</span>ماموریت‌ها
  </button>
  <button class="item" onclick="show('friends')">
   <span>👥</span>دعوت دوستان
  </button>
  <button class="item" onclick="show('wallet')">
   <span>👛</span>کیف پول
  </button>
 </div>
</div>

<div id="mining" class="page">
 <div class="card">
  <h2>⛏️ ماینینگ AFT</h2>
  <p>قدرت فعلی: <b id="power2">1</b></p>
  <button onclick="upgrade()">افزایش قدرت</button>
 </div>
</div>

<div id="tasks" class="page">
 <div class="card">
  <h2>🎯 ماموریت روزانه</h2>
  <p>پاداش آزمایشی: 10 امتیاز</p>
  <button onclick="reward()" id="reward">دریافت پاداش</button>
 </div>
</div>

<div id="friends" class="page">
 <div class="card">
  <h2>👥 دعوت دوستان</h2>
  <input id="ref" readonly style="width:95%;padding:12px">
  <button onclick="copyRef()">کپی لینک</button>
 </div>
</div>

<div id="wallet" class="page">
 <div class="card">
  <h2>👛 کیف پول</h2>
  <div class="balance" id="walletBalance">0</div>
  <p>امتیاز آزمایشی AFT</p>
  <p>برداشت واقعی در نسخه بعدی اضافه می‌شود.</p>
 </div>
</div>

<nav>
 <button onclick="show('home')">🏠 خانه</button>
 <button onclick="show('mining')">⛏️ ماینینگ</button>
 <button onclick="show('tasks')">🎯 ماموریت</button>
 <button onclick="show('friends')">👥 دعوت</button>
 <button onclick="show('wallet')">👛 کیف پول</button>
</nav>

<script>
const tg=window.Telegram.WebApp;
tg.ready();
tg.expand();

let balance=0;
let power=1;
let rewarded=false;

function update(){
 document.getElementById('balance').innerText=balance;
 document.getElementById('walletBalance').innerText=balance;
 document.getElementById('power').innerText=power;
 document.getElementById('power2').innerText=power;
}

function tap(){
 balance+=power;
 update();
}

function upgrade(){
 power++;
 update();
}

function reward(){
 if(rewarded)return;
 balance+=10;
 rewarded=true;
 document.getElementById('reward').innerText='دریافت شد';
 update();
}

function show(id){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}

const user=tg.initDataUnsafe?.user;
document.getElementById('ref').value=
 user ? 'https://t.me/AFT_AIRDROP_bot?start='+user.id : 'ورود از تلگرام لازم است';

function copyRef(){
 const input=document.getElementById('ref');
 input.select();
 document.execCommand('copy');
 alert('لینک کپی شد');
}

update();
</script>
</body>
</html>
